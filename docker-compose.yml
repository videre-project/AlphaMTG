services:
  plugin-build:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /AlphaMTG
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_PACKAGES: /nuget
    tmpfs:
      - /nuget:uid=${UID:-1000},gid=${GID:-1000}
    volumes:
      - .:/AlphaMTG
      - ${PLUGIN_PACKAGES:-./packages}:/packages:ro
    command: ["bash", "scripts/build-plugin.sh", "--source", "/packages", "--source", "https://api.nuget.org/v3/index.json"]
