# MTGOSDK needs AlphaMTG and MTGO in the same Wine prefix to inspect the running client.

name: alphamtg

services:
  alphamtg:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: alphamtg:dev
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      # The base image's Xvfb entrypoint uses :99 for headless mode.
      DISPLAY: :99
      MTGO_VARIANT: headless
      WINEDEBUG: -all
    volumes:
      - .:/workspace
      - alphamtg-wine-data:/home/wine/.wine
    entrypoint: ["/usr/local/bin/xvfb-entrypoint.sh"]
    command: ["/usr/local/bin/run-alphamtg"]

volumes:
  alphamtg-wine-data:
